#!/usr/sbin/nft -f

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy accept;
        # Permitir ping hacia el propio firewall para diagnóstico
        icmp type echo-request accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
        
        # 1. Permitir conexiones establecidas y relacionadas (Respuestas)
        ct state established,related accept
        
        # 2. Permitir ICMP (Ping) explícitamente para pruebas de conectividad
        icmp type echo-request accept

        # 3. Oficinas (210-240) -> DMZ (20) [Nginx]
        ip saddr 10.10.210.0/24 ip daddr 10.10.20.0/24 accept
        ip saddr 10.10.220.0/24 ip daddr 10.10.20.0/24 accept
        ip saddr 10.10.230.0/24 ip daddr 10.10.20.0/24 accept
        ip saddr 10.10.240.0/24 ip daddr 10.10.20.0/24 accept

        # 4. Oficinas (210-240) -> Aplicaciones (30) [NestJS/LDAP]
        ip saddr 10.10.210.0/24 ip daddr 10.10.30.0/24 accept
        ip saddr 10.10.220.0/24 ip daddr 10.10.30.0/24 accept
        ip saddr 10.10.230.0/24 ip daddr 10.10.30.0/24 accept
        ip saddr 10.10.240.0/24 ip daddr 10.10.30.0/24 accept

        # 5. Aplicaciones (30) -> Datos (40) [PostgreSQL]
        ip saddr 10.10.30.0/24 ip daddr 10.10.40.0/24 accept
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}

# TABLA NAT: Crucial para que las respuestas de los servidores lleguen de vuelta a las oficinas
table ip nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        # Enmascarar (Masquerade) el tráfico de las oficinas hacia la DMZ y Apps
        ip saddr 10.10.210.0/24 oifname "eth*" masquerade
        ip saddr 10.10.220.0/24 oifname "eth*" masquerade
        ip saddr 10.10.230.0/24 oifname "eth*" masquerade
        ip saddr 10.10.240.0/24 oifname "eth*" masquerade
    }
}