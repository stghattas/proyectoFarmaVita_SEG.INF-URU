events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name intranet.farmaceutica.local;

        # Frontend React
        location / {
            proxy_pass http://farma_frontend:5173;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Backend API
        location /api/ {
            proxy_pass http://farma_core:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    server {
        listen 80 default_server;
        return 444;
    }
}